# Publishes site/ as a client demo on GitHub Pages:
#   https://paramount22.github.io/SSTN/
# The demo copy gets "noindex", a robots.txt that blocks crawlers and a small
# "Návrh · demo" badge. The source in site/ stays untouched for the real launch.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build demo copy
        run: |
          cp -r site _site
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          sed -i 's|<meta name="viewport" content="width=device-width, initial-scale=1">|&\n  <meta name="robots" content="noindex, nofollow">|' _site/index.html
          sed -i 's|</body>|<div style="position:fixed;left:16px;bottom:16px;z-index:60;padding:.45rem .8rem;border-radius:999px;background:#00295c;color:#fff;font:600 12px/1 system-ui,sans-serif;letter-spacing:.04em;box-shadow:0 8px 20px -8px rgba(0,41,92,.6);pointer-events:none">Návrh · demo</div>\n</body>|' _site/index.html
          grep -q 'noindex' _site/index.html
          grep -q 'Návrh · demo' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
